[package]
name = "archcompose"
version = "0.1.0"
description = "Local-first desktop studio for architectural post-production, drawings and presentation boards."
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
name = "archcompose_lib"
# Desktop only. Mobile targets would need "staticlib" and "cdylib"; the cdylib also
# exceeds the GNU linker's export limit on windows-gnu.
crate-type = ["rlib"]
# Test binaries that link the window runtime lack the Windows common-controls
# manifest and fail to start. Testable logic lives in `archcompose-core`.
test = false
doctest = false

[[bin]]
name = "archcompose"
path = "src/main.rs"
test = false

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
archcompose-core = { path = "core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
